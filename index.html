        <section id="about">
            <div class="container">

                <div class="about__content">

                <div class="about__box_area grid">
                    <div class="about__box">
                        <span class="icon"><img src="./assets/img/about/01.png" alt=""></span>
                        <h5 data-en="A Few Words About Me" data-vi="Đôi Lượt Về Tớ"></h5>
                        <p data-en="Born and raised in Quang Ngai, I am currently a student at Duy Tan University in Da Nang. Since childhood, I have had a deep passion and curiosity for technology and electronic devices. In my free time, I often spend time exploring and researching them, which has helped me accumulate some knowledge along the way." data-vi="Sinh ra và lớn lên tại Quảng Ngãi, hiện tại mình đang là sinh viên của trường Đại học Duy Tân, Đà Nẵng. Ngay từ nhỏ, mình đã có niềm đam mê và sự tò mò đặc biệt đối với công nghệ, đồ điện tử. Những lúc rảnh rỗi, mình thường dành thời gian tìm hiểu, nghiên cứu về chúng và nhờ đó tích lũy được một chút kiến thức."></p>

                    </div>
                    <div class="about__box">
                        <span class="icon"><img src="./assets/img/about/02.png" alt=""></span>
                        <h5 data-en="A Turning Point in Life" data-vi="Bước Ngoặt Trong Cuộc Đời"></h5>
                        <p data-en="The real turning point came during my high school years, especially during the COVID-19 pandemic. With more time at home, I started learning web development and exploring everything that sparked my curiosity. Fortunately, I received generous guidance and support from experienced mentors, which allowed me to absorb a wealth of valuable knowledge. Beyond just learning, I also built a few small websites on my own, marking important milestones in my personal growth journey." data-vi="Bước ngoặt thực sự đến vào những năm cấp 3, đặc biệt là trong khoảng thời gian dịch COVID-19. Khi có nhiều thời gian ở nhà, mình bắt đầu học lập trình web và khám phá mọi thứ mà bản thân tò mò, thắc mắc. May mắn thay, mình được rất nhiều anh chị đi trước tận tình chỉ dẫn, giúp đỡ, nhờ đó mà mình đã tiếp thu được nhiều kiến thức quý giá. Không chỉ dừng lại ở việc học, mình còn tự tay xây dựng một số trang web nhỏ như những cột mốc đánh dấu hành trình phát triển của bản thân."></p>

                    </div>

                    <div class="about__box">
                        <span class="icon"><img src="./assets/img/about/03.png"></span>
                        <h5 data-en="Hobbies" data-vi="Sở Thích"></h5>
                        <p data-en="Besides programming, I have many other interests. I love playing football with my friends, both for fun and to stay active. Additionally, I have a passion for exploring new technologies and discovering unique things I haven't encountered before. I also enjoy meeting and chatting with friends to expand my network and learn interesting things from others. Another favorite hobby of mine is sightseeing, especially visiting places with pristine and peaceful nature." data-vi="Ngoài lập trình, mình còn có nhiều sở thích khác. Mình rất thích chơi bóng đá cùng bạn bè, vừa để giải trí, vừa để rèn luyện sức khỏe. Bên cạnh đó, mình cũng đam mê khám phá những công nghệ mới, tìm tòi những thứ độc đáo mà mình chưa biết. Ngoài ra, mình thích gặp gỡ, trò chuyện với bạn bè để mở rộng mối quan hệ và học hỏi thêm nhiều điều thú vị từ mọi người. Một sở thích khác mà mình rất yêu thích là đi ngắm cảnh đẹp, đặc biệt là những nơi có thiên nhiên hoang sơ, yên bình."></p>

                    </div>
                    <div class="about__box">
                        <span class="icon"><img src="./assets/img/about/04.png"></span>
                        <h5 data-en="Strengths and Weaknesses" data-vi="Ưu Nhược Điểm"></h5>
                        <p data-en="Regarding my strengths, I am naturally curious and always eager to explore and learn about everything around me. Once I find something interesting, I dedicate myself to researching and working hard on it. This trait motivates me to continuously learn and develop myself. Additionally, I am quite open and enjoy socializing with others, which helps me expand my network and gain valuable knowledge from those around me." data-vi="Về điểm mạnh, mình là người có tính tò mò cao, luôn muốn khám phá, tìm hiểu về mọi thứ xung quanh. Một khi đã cảm thấy hứng thú với điều gì, mình sẽ rất chịu khó tìm tòi và làm việc hết mình. Điều này giúp mình có động lực để học hỏi và phát triển bản thân không ngừng. Bên cạnh đó, mình cũng là người khá cởi mở, thích giao lưu với mọi người, điều này giúp mình mở rộng được nhiều mối quan hệ và có cơ hội học hỏi từ những người xung quanh."></p>
                        <p data-en="However, I also have weaknesses that I am working to improve. I can be quite lazy at times and easily lose focus when working on a specific task. Sometimes, I fall into a state of “VIRTUAL EFFORT”—feeling like I’ve done a lot, but in reality, not achieving the desired results. Nevertheless, I am continuously striving to improve myself and find ways to overcome these weaknesses to become better in the future." data-vi="Tuy nhiên, mình cũng có những nhược điểm mà bản thân đang cố gắng khắc phục. Mình khá lười biếng và dễ mất tập trung khi làm một công việc cụ thể. Đôi khi, mình còn rơi vào trạng thái “NỔ LỰC ẢO” – cảm giác như đã làm rất nhiều nhưng thực chất lại chưa đạt được kết quả mong muốn. Dù vậy, mình vẫn đang từng ngày hoàn thiện bản thân và tìm cách khắc phục những điểm yếu này để trở nên tốt hơn trong tương lai."></p>

                    </div>
